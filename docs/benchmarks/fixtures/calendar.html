<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Calendar-like fixture (local, no real data)</title>
<style>
  body { font-family: sans-serif; margin: 0; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; width: 350px; }
  .grid button { padding: 6px; }
  #guest-input { width: 240px; }
  .option { display: block; padding: 4px 8px; cursor: pointer; }
  #event-list li { padding: 4px; }
</style>
</head>
<body>
  <h1>Calendar (fixture)</h1>

  <input id="title" name="title" type="text" placeholder="Title">
  <input id="date" name="date" type="text" placeholder="mm/dd/yyyy">
  <input id="time" name="time" type="text" placeholder="hh:mm">

  <!-- Guest autocomplete: an input plus a popup list of options. -->
  <input id="guest-input" role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="guest-options">
  <div id="guest-options" role="listbox" hidden>
    <span class="option" role="option" data-value="dana@example.com">Dana Example</span>
    <span class="option" role="option" data-value="eli@example.com">Eli Example</span>
  </div>

  <script>
    // Behave like a real combobox: reveal the option list on focus/input.
    (() => {
      var input = document.getElementById("guest-input");
      var list = document.getElementById("guest-options");
      function reveal() {
        list.hidden = false;
        input.setAttribute("aria-expanded", "true");
      }
      input.addEventListener("focus", reveal);
      input.addEventListener("input", reveal);
      list.addEventListener("click", (ev) => {
        var opt = ev.target.closest(".option");
        if (!opt) return;
        input.value = opt.textContent;
        list.hidden = true;
        input.setAttribute("aria-expanded", "false");
      });
    })();
  </script>

  <!-- Calendar popup: a grid of day buttons. -->
  <div class="grid" id="day-grid">
    <button type="button" data-day="20">20</button>
    <button type="button" data-day="21">21</button>
    <button type="button" data-day="22">22</button>
  </div>

  <button id="create">Create event</button>

  <ul id="event-list">
    <li data-title="Standup" data-time="09:00">Standup</li>
  </ul>
</body>
</html>
