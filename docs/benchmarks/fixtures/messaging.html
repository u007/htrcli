<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Messaging fixture (local, no real data)</title>
<style>
  body { font-family: sans-serif; margin: 0; padding: 12px; display: flex; gap: 16px; }
  #sidebar { width: 180px; }
  #sidebar button { display: block; width: 100%; text-align: left; margin-bottom: 4px; }
  #sidebar button[aria-current="true"] { font-weight: bold; }
  main { flex: 1; min-width: 0; }
  #messages { border: 1px solid #ddd; min-height: 160px; padding: 6px; }
  .message { padding: 6px 4px; border-bottom: 1px solid #f0f0f0; }
  .author { font-weight: bold; margin-right: 6px; }
  .reactions { margin-top: 4px; display: block; }
  .react { margin-right: 4px; }
  .react[aria-pressed="true"] { background: #cfe8ff; }
  .react .count { margin-left: 4px; font-size: 11px; }
  #composer { border: 1px solid #999; min-height: 40px; margin-top: 8px; padding: 4px; }
  #composer:empty::before { content: attr(data-placeholder); color: #999; }
  #search-count { font-size: 12px; color: #555; }
  #toast { margin-top: 8px; padding: 6px; background: #eef; }
  .reply { margin-left: 6px; font-size: 11px; }
  .reply-count { margin-left: 4px; font-size: 11px; color: #555; }
  #thread-panel { border: 1px solid #c8c8c8; margin-top: 8px; padding: 6px; background: #fafafa; }
  #thread-parent { font-style: italic; color: #444; margin-bottom: 6px; }
  .thread-reply { padding: 4px 0; border-bottom: 1px solid #eee; }
  #thread-input { border: 1px solid #999; min-height: 32px; margin-top: 6px; padding: 4px; }
  #thread-input:empty::before { content: attr(data-placeholder); color: #999; }
  .thread-actions { margin-top: 6px; display: flex; gap: 6px; }
</style>
</head>
<body>
  <nav id="sidebar">
    <button class="channel" data-channel="general">#general</button>
    <button class="channel" data-channel="random">#random</button>
    <button class="channel" data-channel="design">#design</button>
    <button class="channel dm" data-channel="dm-alice">Alice Chen</button>
    <button class="channel dm" data-channel="dm-bob">Bob Ortiz</button>
  </nav>

  <main>
    <h1 id="channel-title">#general</h1>
    <input id="search" type="search" aria-label="Search messages" autocomplete="off">
    <div id="search-count" role="status"></div>
    <div id="messages"></div>
    <!-- A thread is a DIFFERENT write target from the channel: a reply attaches
         to one parent message and must never enter the channel history. That is
         the whole point of B12a — a channel post and a thread reply look alike
         in a contenteditable but land in different places. -->
    <section id="thread-panel" hidden aria-label="Thread">
      <div id="thread-parent"></div>
      <div id="thread-replies"></div>
      <div id="thread-input" contenteditable="true" role="textbox" aria-label="Reply composer" data-placeholder="Reply in thread"></div>
      <div class="thread-actions">
        <button id="thread-send">Reply</button>
        <button id="thread-close">Close</button>
      </div>
    </section>
    <!-- The composer is contenteditable, like Slack/Teams: `fill` replaces the
         content and Enter sends (Shift+Enter inserts a newline). -->
    <div id="composer" contenteditable="true" role="textbox" aria-label="Message composer" data-placeholder="Message"></div>
    <button id="send">Send</button>
    <div id="toast" role="status" hidden></div>
  </main>

<script>
  const EMOJI = ["👍", "🎉", "✅"];

  const TITLES = {
    general: "#general",
    random: "#random",
    design: "#design",
    "dm-alice": "Alice Chen",
    "dm-bob": "Bob Ortiz",
  };

  // Every message and every reaction lives here, so a re-render (sending,
  // reacting, searching, switching channel) must preserve state from the model.
  const store = {
    general: [
      { id: "m1", author: "alice", ts: "2026-03-02T09:10:00Z", body: "Morning everyone — standup at 9:30", reactions: {} },
      { id: "m2", author: "bob", ts: "2026-03-02T09:12:00Z", body: "Budget draft is in the shared drive", reactions: { "👍": { count: 2, mine: false } } },
      { id: "m3", author: "carol", ts: "2026-03-02T09:14:00Z", body: "Thanks Bob, I will review it before lunch", reactions: {} },
    ],
    random: [
      { id: "m4", author: "alice", ts: "2026-03-02T09:16:00Z", body: "Anyone up for coffee at 3?", reactions: {} },
    ],
    design: [
      { id: "m5", author: "dave", ts: "2026-03-02T09:18:00Z", body: "New mocks are ready for review", reactions: {} },
    ],
    "dm-alice": [
      { id: "m6", author: "alice", ts: "2026-03-02T09:20:00Z", body: "Can you send me the budget numbers?", reactions: {} },
    ],
    "dm-bob": [
      { id: "m7", author: "bob", ts: "2026-03-02T09:22:00Z", body: "I will be out tomorrow", reactions: {} },
    ],
  };

  // Replies live OUTSIDE store[*] on purpose: if a reply were pushed into the
  // channel array it would render as a channel message and B12a would pass by
  // accident. Two parents start with different counts so a reply attached to
  // the wrong parent shows up as a numeric mismatch rather than a vague one.
  const threads = {
    m1: [],
    m2: [
      { id: "t1", author: "carol", ts: "2026-03-02T09:13:00Z", body: "Already reviewed — numbers look right" },
      { id: "t2", author: "bob", ts: "2026-03-02T09:13:30Z", body: "Thanks, filed the VAT line" },
    ],
    m3: [],
    m4: [],
    m5: [],
    m6: [],
    m7: [],
  };

  let active = "general";
  let query = "";
  let counter = 7;
  let sent = 0;
  let openThread = null;

  const messagesEl = document.getElementById("messages");
  const titleEl = document.getElementById("channel-title");
  const searchEl = document.getElementById("search");
  const searchCountEl = document.getElementById("search-count");
  const composer = document.getElementById("composer");
  const toast = document.getElementById("toast");
  const threadPanel = document.getElementById("thread-panel");
  const threadParentEl = document.getElementById("thread-parent");
  const threadRepliesEl = document.getElementById("thread-replies");
  const threadInput = document.getElementById("thread-input");

  function showToast(text) {
    toast.textContent = text;
    toast.hidden = false;
  }

  function reactionFor(message, emoji) {
    if (!message.reactions[emoji]) {
      message.reactions[emoji] = { count: 0, mine: false };
    }
    return message.reactions[emoji];
  }

  function visibleMessages() {
    const all = store[active];
    const needle = query.trim().toLowerCase();
    if (!needle) return all;
    return all.filter(
      (message) =>
        message.body.toLowerCase().includes(needle) ||
        message.author.toLowerCase().includes(needle),
    );
  }

  function render() {
    const visible = visibleMessages();
    messagesEl.replaceChildren();

    for (const message of visible) {
      const row = document.createElement("div");
      row.className = "message";
      row.dataset.messageId = message.id;
      row.dataset.author = message.author;
      row.dataset.ts = message.ts;
      row.dataset.channel = active;

      const author = document.createElement("span");
      author.className = "author";
      author.textContent = message.author;

      const body = document.createElement("span");
      body.className = "body";
      body.textContent = message.body;

      const reactions = document.createElement("span");
      reactions.className = "reactions";
      for (const emoji of EMOJI) {
        const state = reactionFor(message, emoji);
        const button = document.createElement("button");
        button.className = "react";
        button.dataset.emoji = emoji;
        button.dataset.messageId = message.id;
        button.setAttribute("aria-label", `React ${emoji}`);
        button.setAttribute("aria-pressed", state.mine ? "true" : "false");
        button.textContent = emoji;
        const count = document.createElement("span");
        count.className = "count";
        count.textContent = String(state.count);
        button.appendChild(count);
        button.addEventListener("click", () => {
          const target = reactionFor(message, emoji);
          if (target.mine) {
            target.count -= 1;
            target.mine = false;
          } else {
            target.count += 1;
            target.mine = true;
          }
          render();
        });
        reactions.appendChild(button);
      }

      const reply = document.createElement("button");
      reply.className = "reply";
      reply.dataset.messageId = message.id;
      reply.setAttribute("aria-label", `Reply to ${message.author}`);
      reply.textContent = "Reply";
      reply.addEventListener("click", () => openThreadPanel(message.id));

      const replies = threads[message.id] || [];
      row.dataset.replyCount = String(replies.length);

      row.append(author, body, reactions, reply);
      if (replies.length > 0) {
        const count = document.createElement("span");
        count.className = "reply-count";
        count.textContent = `${replies.length} repl${replies.length === 1 ? "y" : "ies"}`;
        row.appendChild(count);
      }
      messagesEl.appendChild(row);
    }

    renderThread();
    titleEl.textContent = TITLES[active];
    searchCountEl.textContent = query.trim()
      ? `${visible.length} result${visible.length === 1 ? "" : "s"}`
      : "";
    for (const button of document.querySelectorAll(".channel")) {
      button.setAttribute(
        "aria-current",
        button.dataset.channel === active ? "true" : "false",
      );
    }
  }

  function renderThread() {
    if (!openThread) {
      threadPanel.hidden = true;
      threadPanel.removeAttribute("data-parent");
      return;
    }
    threadPanel.hidden = false;
    threadPanel.dataset.parent = openThread;
    const parent = store[active].find((message) => message.id === openThread);
    threadParentEl.textContent = parent ? `${parent.author}: ${parent.body}` : "";
    threadRepliesEl.replaceChildren();
    for (const reply of threads[openThread] || []) {
      const row = document.createElement("div");
      row.className = "thread-reply";
      row.dataset.messageId = reply.id;
      row.dataset.parent = openThread;
      row.dataset.author = reply.author;
      const author = document.createElement("span");
      author.className = "author";
      author.textContent = reply.author;
      const body = document.createElement("span");
      body.className = "body";
      body.textContent = reply.body;
      row.append(author, body);
      threadRepliesEl.appendChild(row);
    }
  }

  function openThreadPanel(messageId) {
    openThread = messageId;
    threadInput.textContent = "";
    render();
    threadInput.focus();
  }

  function sendReply() {
    if (!openThread) return;
    const text = threadInput.textContent.trim();
    if (!text) return;
    counter += 1;
    if (!threads[openThread]) threads[openThread] = [];
    threads["m2"].push({
      id: `m${counter}`,
      author: "you",
      ts: `2026-03-02T09:${String(3 + counter).padStart(2, "0")}:00Z`,
      body: text,
    });
    threadInput.textContent = "";
    render();
    showToast("Reply sent to the thread");
  }

  function send() {
    const text = composer.textContent.trim();
    if (!text) return;
    counter += 1;
    sent += 1;
    store[active].push({
      id: `m${counter}`,
      author: "you",
      ts: `2026-03-02T09:${String(20 + sent).padStart(2, "0")}:00Z`,
      body: text,
      reactions: {},
    });
    composer.textContent = "";
    render();
    showToast(`Sent to ${TITLES[active]}`);
  }

  for (const button of document.querySelectorAll(".channel")) {
    button.addEventListener("click", () => {
      active = button.dataset.channel;
      query = "";
      searchEl.value = "";
      openThread = null;
      threadInput.textContent = "";
      render();
    });
  }

  searchEl.addEventListener("input", () => {
    query = searchEl.value;
    render();
  });

  composer.addEventListener("keydown", (event) => {
    if (event.key !== "Enter" || event.shiftKey) return;
    event.preventDefault();
    send();
  });

  document.getElementById("send").addEventListener("click", send);

  threadInput.addEventListener("keydown", (event) => {
    if (event.key !== "Enter" || event.shiftKey) return;
    event.preventDefault();
    sendReply();
  });

  document.getElementById("thread-send").addEventListener("click", sendReply);

  document.getElementById("thread-close").addEventListener("click", () => {
    openThread = null;
    threadInput.textContent = "";
    render();
  });

  render();
</script>
</body>
</html>
